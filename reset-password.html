<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Jobsy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paint: #1e4fd7;
      --paint-deep: #163db0;
      --ink: #0a0a0c;
      --mute: #5c6478;
      --paper: #f3f4f7;
      --danger: #dc2626;
      --ok: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Manrope, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 50% at 85% 10%, rgba(30, 79, 215, 0.28), transparent 55%),
        radial-gradient(ellipse 50% 40% at 10% 90%, rgba(30, 79, 215, 0.12), transparent 50%),
        var(--paper);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 440px);
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(10, 10, 12, 0.08);
      border-radius: 1.75rem;
      padding: 2.25rem 1.75rem 1.75rem;
      box-shadow: 0 40px 80px -48px rgba(10, 10, 12, 0.45);
      backdrop-filter: blur(12px);
      animation: rise 0.55s ease-out;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .mark {
      width: 3.5rem;
      height: 3.5rem;
      margin: 0 auto 1rem;
      border-radius: 1rem;
      background: var(--paint);
      color: white;
      display: grid;
      place-items: center;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
    }
    h1 {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 1.85rem;
      letter-spacing: -0.03em;
      text-align: center;
    }
    .sub {
      margin-top: 0.5rem;
      text-align: center;
      color: var(--mute);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    label {
      display: block;
      margin: 1.1rem 0 0.4rem;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .field {
      position: relative;
    }
    input {
      width: 100%;
      border: 1.5px solid rgba(10, 10, 12, 0.12);
      border-radius: 0.9rem;
      padding: 0.85rem 2.75rem 0.85rem 1rem;
      font: inherit;
      background: #f8f9fc;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    input:focus {
      border-color: rgba(30, 79, 215, 0.45);
      background: white;
      box-shadow: 0 0 0 3px rgba(30, 79, 215, 0.15);
    }
    .toggle {
      position: absolute;
      right: 0.55rem;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--mute);
      cursor: pointer;
      padding: 0.4rem;
    }
    .bar {
      margin-top: 0.5rem;
      height: 0.35rem;
      border-radius: 999px;
      background: rgba(10, 10, 12, 0.08);
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      transition: width 0.25s ease, background 0.25s ease;
    }
    .hint { margin-top: 0.35rem; font-size: 0.78rem; color: var(--mute); }
    .error {
      display: none;
      margin-top: 0.85rem;
      padding: 0.75rem 0.9rem;
      border-radius: 0.85rem;
      background: #fef2f2;
      color: var(--danger);
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .error.show { display: block; }
    .btn {
      width: 100%;
      margin-top: 1.35rem;
      border: 0;
      border-radius: 999px;
      padding: 0.95rem 1.25rem;
      font: inherit;
      font-weight: 800;
      color: white;
      background: var(--paint);
      cursor: pointer;
      box-shadow: 0 16px 36px -18px rgba(30, 79, 215, 0.9);
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover:not(:disabled) { background: var(--paint-deep); transform: translateY(-1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .success { display: none; text-align: center; padding: 0.5rem 0 0.25rem; }
    .success.show { display: block; }
    .form.hide { display: none; }
    .ok-icon {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1rem;
      border-radius: 999px;
      background: rgba(22, 163, 74, 0.12);
      color: var(--ok);
      display: grid;
      place-items: center;
    }
    .foot {
      margin-top: 1.75rem;
      padding-top: 1.1rem;
      border-top: 1px solid rgba(10, 10, 12, 0.08);
      text-align: center;
      font-size: 0.8rem;
      color: var(--mute);
    }
    .foot a { color: var(--paint); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div id="formView">
      <div class="mark" aria-hidden="true">J</div>
      <h1>Reset password</h1>
      <p class="sub">Choose a new password for your Jobsy account.</p>

      <form id="resetForm" novalidate>
        <label for="newPassword">New password</label>
        <div class="field">
          <input id="newPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters" required />
          <button type="button" class="toggle" data-target="newPassword" aria-label="Show password">👁</button>
        </div>
        <div class="bar"><span id="strengthBar"></span></div>
        <p class="hint" id="strengthText">Password strength</p>

        <label for="confirmPassword">Confirm password</label>
        <div class="field">
          <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter password" required />
          <button type="button" class="toggle" data-target="confirmPassword" aria-label="Show password">👁</button>
        </div>

        <div class="error" id="errorMessage" role="alert"></div>
        <button class="btn" id="submitBtn" type="submit">Update password</button>
      </form>
    </div>

    <div class="success" id="successView">
      <div class="ok-icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1>Password updated</h1>
      <p class="sub">You’re set. Open the Jobsy app and sign in with your new password.</p>
      <a class="btn" href="jobsy://login-callback" style="display:inline-flex;text-decoration:none;margin-top:1.35rem">Open Jobsy app</a>
    </div>

    <div class="foot">
      Built by <a href="https://futurifydesigns.com" target="_blank" rel="noreferrer">Futurify Designs</a>
      · <a href="./">Email verified</a>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const supabase = createClient(
      'https://jvulfleleybcoljcmpwq.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp2dWxmbGVsZXliY29samNtcHdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3NDA4ODgsImV4cCI6MjA4NDMxNjg4OH0.5MbMVUlsbHk3i-y7diYnnS40uSQ2aC2iaNEkdFRY9Dc'
    )

    const errorEl = document.getElementById('errorMessage')
    const strengthBar = document.getElementById('strengthBar')
    const strengthText = document.getElementById('strengthText')
    let ready = false

    function showError(msg) {
      errorEl.innerHTML = msg
      errorEl.classList.add('show')
    }
    function clearError() {
      errorEl.classList.remove('show')
      errorEl.textContent = ''
    }

    async function bootstrapSession() {
      const hash = new URLSearchParams(window.location.hash.slice(1))
      const query = new URLSearchParams(window.location.search)
      const accessToken = hash.get('access_token')
      const refreshToken = hash.get('refresh_token')
      const type = hash.get('type')
      const code = query.get('code')

      try {
        if (code) {
          const { error } = await supabase.auth.exchangeCodeForSession(code)
          if (error) throw error
          ready = true
          return
        }
        if (accessToken && (type === 'recovery' || !type)) {
          const { error } = await supabase.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken || '',
          })
          if (error) throw error
          ready = true
          return
        }
        const { data: { session } } = await supabase.auth.getSession()
        if (session) {
          ready = true
          return
        }
        showError('This reset link is invalid or expired. Request a new one from the Jobsy app or website.')
      } catch (err) {
        showError(err?.message || 'Could not open reset session. Request a new link.')
      }
    }

    await bootstrapSession()

    document.querySelectorAll('.toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const input = document.getElementById(btn.dataset.target)
        input.type = input.type === 'password' ? 'text' : 'password'
      })
    })

    document.getElementById('newPassword').addEventListener('input', (e) => {
      const p = e.target.value
      let score = 0
      if (p.length >= 8) score++
      if (p.length >= 12) score++
      if (/[a-z]/.test(p) && /[A-Z]/.test(p)) score++
      if (/\d/.test(p)) score++
      if (/[^A-Za-z0-9]/.test(p)) score++
      const pct = Math.min(100, (score / 5) * 100)
      strengthBar.style.width = `${pct}%`
      if (score <= 2) {
        strengthBar.style.background = '#ef4444'
        strengthText.textContent = 'Weak — add length, numbers, or symbols'
      } else if (score <= 3) {
        strengthBar.style.background = '#f59e0b'
        strengthText.textContent = 'Fair'
      } else {
        strengthBar.style.background = '#16a34a'
        strengthText.textContent = 'Strong'
      }
    })

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      clearError()
      if (!ready) {
        showError('No valid reset session. Request a new password reset link.')
        return
      }
      const password = document.getElementById('newPassword').value
      const confirm = document.getElementById('confirmPassword').value
      if (password.length < 8) {
        showError('Password must be at least 8 characters.')
        return
      }
      if (password !== confirm) {
        showError('Passwords do not match.')
        return
      }
      const btn = document.getElementById('submitBtn')
      btn.disabled = true
      btn.textContent = 'Updating…'
      try {
        const { error } = await supabase.auth.updateUser({ password })
        if (error) throw error
        document.getElementById('formView').classList.add('hide')
        document.getElementById('successView').classList.add('show')
      } catch (err) {
        showError(err?.message || 'Could not update password. Request a new link.')
        btn.disabled = false
        btn.textContent = 'Update password'
      }
    })
  </script>
</body>
</html>
