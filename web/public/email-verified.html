<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Verified — Jobsy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paint: #1e4fd7;
      --paint-deep: #163db0;
      --ink: #0a0a0c;
      --mute: #5c6478;
      --paper: #f3f4f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Manrope, system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 70% 50% at 85% 10%, rgba(30, 79, 215, 0.28), transparent 55%),
        radial-gradient(ellipse 50% 40% at 10% 90%, rgba(30, 79, 215, 0.12), transparent 50%),
        var(--paper);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(100%, 440px);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(10, 10, 12, 0.08);
      border-radius: 1.75rem;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: 0 40px 80px -48px rgba(10, 10, 12, 0.45);
      backdrop-filter: blur(12px);
      animation: rise 0.55s ease-out;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .mark {
      width: 4.5rem;
      height: 4.5rem;
      margin: 0 auto 1.25rem;
      border-radius: 1.25rem;
      background: var(--paint);
      color: white;
      display: grid;
      place-items: center;
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 2rem;
      box-shadow: 0 18px 40px -18px rgba(30, 79, 215, 0.85);
    }
    .badge {
      width: 4rem;
      height: 4rem;
      margin: 0 auto 1.25rem;
      border-radius: 999px;
      background: rgba(30, 79, 215, 0.12);
      color: var(--paint);
      display: grid;
      place-items: center;
    }
    h1 {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: clamp(1.75rem, 5vw, 2.15rem);
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    p {
      margin-top: 0.75rem;
      color: var(--mute);
      line-height: 1.55;
      font-size: 0.98rem;
    }
    .actions {
      margin-top: 1.75rem;
      display: none;
    }
    .actions.show { display: grid; gap: 0.75rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      padding: 0.9rem 1.25rem;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .btn-primary {
      background: var(--paint);
      color: white;
      box-shadow: 0 16px 36px -18px rgba(30, 79, 215, 0.9);
    }
    .btn-primary:hover {
      background: var(--paint-deep);
      transform: translateY(-1px);
    }
    .foot {
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(10, 10, 12, 0.08);
      font-size: 0.8rem;
      color: var(--mute);
    }
    .foot a { color: var(--paint); font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">J</div>
    <div class="badge" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5" />
      </svg>
    </div>
    <h1>Email verified</h1>
    <p id="copy">Your Jobsy account is confirmed.</p>
    <div class="actions" id="actions">
      <a class="btn btn-primary" href="./">Return to site</a>
    </div>
    <div class="foot">
      Built by <a href="https://futurifydesigns.com" target="_blank" rel="noreferrer">Futurify Designs</a>
      · © <span id="y"></span> Jobsy
    </div>
  </main>
  <script>
    document.getElementById('y').textContent = new Date().getFullYear()

    const params = new URLSearchParams(window.location.search)
    const from = (params.get('from') || '').toLowerCase()
    const uaMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
    // App signup (or mobile without from=web) → close page. Website signup → return to site.
    const isAppFlow = from === 'app' || (from !== 'web' && uaMobile)

    const copy = document.getElementById('copy')
    const actions = document.getElementById('actions')

    if (isAppFlow) {
      copy.textContent =
        'Your Jobsy account is confirmed. You can close this page and open the Jobsy app to sign in.'
    } else {
      copy.textContent =
        'Your Jobsy account is confirmed. Return to the site to continue signing in.'
      actions.classList.add('show')
    }
  </script>
</body>
</html>
